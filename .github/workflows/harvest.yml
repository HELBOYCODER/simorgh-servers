name: harvest

# Every two hours: fetch the public config feeds (deploy/crowd/sources.json
# and deploy/crowd/harvest-sources.json) and the configs posted in Iranian
# Telegram channels (deploy/crowd/telegram-channels.json is the seed list;
# the harvest finds more and remembers them in telegram-state.json on the
# crowd-data branch), test every config the way the Simorgh app does, and
# publish the ones that work and are encrypted as verified.txt on the
# crowd-data branch. The app searches that list before the big feeds, so it
# usually connects without downloading or testing thousands of dead entries
# on a slow link.
#
# Derived from the `harvest` workflow of zeghostwriter/ZeroNet (MIT); the
# tool names, repository, and crate are Simorgh's. See NOTICE.
#
# The harvest tools (simorgh-harvest, simorgh-sign) live in the engine
# repository HELBOYCODER/simorgh-core, not in this one.
on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the fresh and crowd workflows: all three replace the
# crowd-data commit.
concurrency:
  group: crowd-data
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIMORGH_CORE_REF: engine-v0.1.0
      # simorgh-core publishes the tools under package `zero-discovery`
      # with Simorgh binary names (`simorgh-harvest` / `simorgh-sign`).
      SIMORGH_CORE_PACKAGE: zero-discovery
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: crowd
      - name: build the discovery tools from simorgh-core
        run: |
          git clone --depth 1 --branch "$SIMORGH_CORE_REF" \
            "https://github.com/HELBOYCODER/simorgh-core.git" simorgh-core
          cargo build --release --manifest-path simorgh-core/Cargo.toml \
            -p "$SIMORGH_CORE_PACKAGE" --bin simorgh-harvest --bin simorgh-sign
      - name: channels found by earlier runs
        run: |
          curl -fsS --max-time 30 -o telegram-state.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/crowd-data/telegram-state.json" \
            || echo '{}' > telegram-state.json
      - name: find and test configs
        run: |
          simorgh-core/target/release/simorgh-harvest \
            --sources deploy/crowd/sources.json \
            --sources deploy/crowd/harvest-sources.json \
            --telegram deploy/crowd/telegram-channels.json \
            --telegram-state telegram-state.json \
            --out verified.txt --want 300 --min 20 --minutes 20
      # Keep what the fresh workflow found in the priority channels at the
      # top; it tested them in the last ten minutes.
      - name: keep the fresh configs at the top
        run: |
          git fetch -q --depth 1 origin crowd-data
          if git show FETCH_HEAD:fresh.txt > fresh.txt 2>/dev/null; then
            simorgh-core/target/release/simorgh-harvest merge --top fresh.txt \
              --rest verified.txt --out verified.txt
          fi
      # Sign the list so apps can tell a genuine one from a CDN's or a
      # network's substitute. Skipped, with a warning, when no signing key is
      # set: the app then falls back to trusting the list as before.
      # The secret is the base64/hex Ed25519 seed; its public half is
      # compiled into simorgh-core (its sign module's PUBLIC_KEY_HEX). Make
      # the pair with `simorgh-sign keygen` once, paste the public key into
      # simorgh-core, and store the seed as this repository's secret.
      - name: sign the list
        env:
          CROWD_SIGNING_KEY: ${{ secrets.CROWD_SIGNING_KEY }}
        run: |
          if [ -n "$CROWD_SIGNING_KEY" ]; then
            simorgh-core/target/release/simorgh-sign sign verified.txt
            # The app rejects a list whose signature does not verify against
            # the key compiled into it. A secret that belongs to another key
            # would publish lists nobody accepts, so stop here instead.
            simorgh-core/target/release/simorgh-sign verify verified.txt
          else
            echo "::warning::No CROWD_SIGNING_KEY; publishing verified.txt unsigned. Create a key pair with 'simorgh-sign keygen' and store the seed as that secret."
          fi
      - name: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          files="verified.txt telegram-state.json"
          [ -f verified.txt.sig ] && files="$files verified.txt.sig"
          .github/scripts/publish-crowd-data.sh $files
